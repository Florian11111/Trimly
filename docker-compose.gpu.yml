# NVIDIA GPU encoding (NVENC) on Windows/WSL2 with Docker Desktop.
#
# "--gpus all" is not enough here: Docker Desktop only mounts part of the
# NVIDIA driver files, and CUDA then fails with "cuInit ... named symbol
# not found". So the complete WSL drivers are mounted directly.
#
# Start with:
# docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
#
# Without an NVIDIA card, leave this file out; the backend then uses the CPU.
services:
  backend:
    devices:
      - /dev/dxg
    volumes:
      - /usr/lib/wsl:/usr/lib/wsl:ro
    environment:
      - LD_LIBRARY_PATH=/usr/lib/wsl/lib
