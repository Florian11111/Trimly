# Builds the desktop app (Tauri 2) for Windows, macOS and Linux, uploads everything to a
# draft release and publishes it once all builds have succeeded.
# Trigger: a tag like v0.2.0. Steps: see CLAUDE.md, section "Release".
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Creates the draft once; all build jobs upload to the same one
  # (otherwise they could each create their own draft at the same time).
  create-release:
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v7

      # Tag and version must match, otherwise the installers are named differently from the release
      - name: Check version
        shell: bash
        run: |
          VERSION=$(node -p "require('./frontend/package.json').version")
          CARGO=$(sed -n 's/^version = "\(.*\)"$/\1/p' frontend/src-tauri/Cargo.toml | head -n 1)
          echo "Tag $GITHUB_REF_NAME, package.json $VERSION, Cargo.toml $CARGO"
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ] || [ "$VERSION" != "$CARGO" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json ($VERSION) / Cargo.toml ($CARGO)"
            exit 1
          fi

      - name: Write release notes
        shell: bash
        run: |
          # ffmpeg version for the GPL notice
          FFMPEG=$(sed -n 's/^FFMPEG_VERSION="\${FFMPEG_VERSION:-\(.*\)}"$/\1/p' frontend/src-tauri/scripts/build-ffmpeg.sh)
          SCRIPT_URL="https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_SHA/frontend/src-tauri/scripts/build-ffmpeg.sh"
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          ## Download

          - **Windows:** \`Trimly_…_x64-setup.exe\` (or the \`.msi\`). ffmpeg is included.
          - **macOS 11+ (Apple Silicon):** \`Trimly_…_aarch64.dmg\`. ffmpeg is included.
          - **Linux:** \`Trimly_…_amd64.deb\` (Debian, Ubuntu; installs ffmpeg as a dependency), \`.rpm\` (Fedora; \`sudo dnf install ffmpeg\`) or \`.AppImage\` (any distribution; needs ffmpeg from your package manager). ARM64 builds are marked \`aarch64\`/\`arm64\`.

          ## Unsigned builds

          These installers are not code-signed, so your system will warn you once:

          - **Windows (SmartScreen):** click **More info → Run anyway**.
          - **macOS:** right-click Trimly in Applications → **Open** → **Open**. On macOS 15 or newer, try to open it once, then click **Open Anyway** in **System Settings → Privacy & Security**.
            Alternative: \`xattr -dr com.apple.quarantine /Applications/Trimly.app\`

          ## License of the bundled ffmpeg (Windows and macOS)

          The Windows and macOS installers ship a minimal static build of [FFmpeg](https://ffmpeg.org) $FFMPEG with libx264, licensed under the **GPL v3**. Trimly runs it as a separate program.

          - FFmpeg source code: https://ffmpeg.org/releases/ffmpeg-$FFMPEG.tar.xz
          - Build script with all configure options: [build-ffmpeg.sh]($SCRIPT_URL)
          EOF
          cat "$RUNNER_TEMP/notes.md"

      - name: Create draft release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$GITHUB_REF_NAME" \
            -f name="Trimly $GITHUB_REF_NAME" \
            -F draft=true \
            -F body=@"$RUNNER_TEMP/notes.md" \
            --jq .id)
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.name }})
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            platform: windows-latest
          - name: macOS (Apple Silicon)
            platform: macos-latest
          # 22.04: older glibc, so .deb and AppImage also run on older distributions
          - name: Linux (x64)
            platform: ubuntu-22.04
          - name: Linux (ARM64)
            platform: ubuntu-22.04-arm
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v7

      # --- Linux: WebKitGTK and GStreamer (preview player) ---------------------
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf file \
            gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav

      # --- Bundled ffmpeg (Windows and macOS) -----------------------------------
      # The build takes long, so it is cached; it is only rebuilt when the script changes.
      - name: Cache bundled ffmpeg
        if: runner.os != 'Linux'
        id: ffmpeg-cache
        uses: actions/cache@v6
        with:
          path: frontend/src-tauri/binaries/ffmpeg-*
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('frontend/src-tauri/scripts/build-ffmpeg.sh') }}

      - name: Set up MSYS2 (UCRT64)
        if: runner.os == 'Windows' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          # as in the header of scripts/build-ffmpeg.sh
          install: >-
            make
            diffutils
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-nasm
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-x264
            mingw-w64-ucrt-x86_64-lame
            mingw-w64-ucrt-x86_64-dav1d
            mingw-w64-ucrt-x86_64-amf-headers
            mingw-w64-ucrt-x86_64-ffnvcodec-headers
            mingw-w64-ucrt-x86_64-libvpl

      - name: Build bundled ffmpeg
        if: runner.os == 'Windows' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        working-directory: frontend/src-tauri
        run: bash scripts/build-ffmpeg.sh

      # macOS: static libraries from Homebrew, the script builds dav1d itself
      - name: Build bundled ffmpeg (macOS)
        if: runner.os == 'macOS' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: bash
        working-directory: frontend/src-tauri
        run: |
          brew install nasm pkgconf meson ninja x264 lame mpg123
          bash scripts/build-ffmpeg.sh

      - name: Check bundled ffmpeg
        if: runner.os != 'Linux'
        shell: bash
        working-directory: frontend/src-tauri/binaries
        run: |
          ls -lh
          for tool in ffmpeg-* ffprobe-*; do ./"$tool" -hide_banner -version | head -n 1; done
          # macOS: may only need system libraries, otherwise it won't run without Homebrew
          if [ "$RUNNER_OS" = macOS ]; then
            if otool -L ffmpeg-* ffprobe-* | tail -n +2 | grep -v -e '^[^[:space:]]' -e /usr/lib/ -e /System/; then
              echo "::error::ffmpeg depends on libraries outside the system"; exit 1
            fi
          fi

      # --- Werkzeuge ------------------------------------------------------------
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri -> target

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # --- Build and upload -----------------------------------------------------
      - name: Build and upload to draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GitHub sets CI=true, which makes Create React App fail on ESLint warnings
          CI: false
          # macOS: ad-hoc signing (no Apple certificate). Without any signature, macOS on
          # Apple Silicon reports "damaged" instead of just "unidentified developer".
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
        with:
          projectPath: frontend
          releaseId: ${{ needs.create-release.outputs.id }}

  # The draft is only published once all builds are green.
  # If one fails, it stays a draft (see CLAUDE.md, "Release").
  # Tags with a hyphen (v0.3.0-beta.1) are published as a pre-release.
  publish:
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.create-release.outputs.id }}
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then PRE=true; LATEST=false; else PRE=false; LATEST=true; fi
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -F draft=false -F prerelease=$PRE -f make_latest=$LATEST \
            --jq '"Published: " + .html_url'
