# https://www.playframework.com/documentation/latest/Configuration
play.http.parser.maxMemoryBuffer = 512k
# Upload limit (large videos)
play.http.parser.maxDiskBuffer = 20GB

# Long timeouts for large files and ffmpeg
play.server.http.idleTimeout = 10m
play.server.http.requestTimeout = 10m

# Secret: dev default, override in production with the APPLICATION_SECRET env variable
play.http.secret.key = "dev-secret-key-not-for-production-must-be-long-enough-for-hs256-256bit"
play.http.secret.key = ${?APPLICATION_SECRET}

# Hosts (proxied by nginx, so the internal host name is enough)
play.filters.hosts.allowed = ["."]

play.filters.enabled += "play.filters.cors.CORSFilter"
play.filters.disabled += "play.filters.csrf.CSRFFilter"
# In production everything goes through nginx (same origin), CORS is only needed for dev
play.filters.cors.allowedOrigins = ["http://localhost:3000", ${?CORS_ORIGIN}]
play.filters.cors.allowedMethods = ["GET", "POST", "PUT", "DELETE"]
play.filters.cors.allowedHeaders = ["Content-Type", "X-Requested-With", "Accept", "Origin"]
